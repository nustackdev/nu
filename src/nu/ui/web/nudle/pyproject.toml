[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nudle"
version = "0.1.3"
description = "nudle web bundle -- compiled UI assets for the nu.ui fabric"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build.targets.wheel]
packages = ["nudle"]
# `nudle/build` is a symlink to `../dist` (vite output). Exclude it from the
# package walk to avoid a double-add; force-include below places the real
# `dist/` contents at the wheel path `nudle/build/`.
exclude = ["nudle/build"]

[tool.hatch.build.targets.wheel.force-include]
"dist" = "nudle/build"
