[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nu"
version = "0.1.0"
description = "Term Programming platform — kernel, toolbox, and topologies"
readme = "../README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "attrs>=23.0.0",
]
keywords = ["term", "programming", "tree", "topology", "shape", "table", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
minimal = [
    "nu-datetime",
    "nu-fin",
    "nu-math",
    "nu-path",
    "nu-uuid",
]
default = [
    "nu[minimal]",
    "nu-virtuals",
    "nu-dict",
    "nu-shape-lens",
    "nu-tree-view",
]
distributed = [
    "nu[default]",
    "nu-distributed",
]
all = [
    "nu[distributed]",
]

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build.targets.wheel]
packages = ["nu"]
