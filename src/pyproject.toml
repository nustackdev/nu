[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nu"
version = "0.1.0"
description = "Term Programming platform — kernel, toolbox, and topologies"
readme = "../README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "attrs>=23.0.0",
]
keywords = ["term", "programming", "tree", "topology", "shape", "table", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
default = [
    "nu-virtuals",
    "nu-mem",
]
infra = [
    "nu[default]",
    "nu-virtuals[infra]",
]
distributed = [
    "nu[infra]",
    "composables",
    "invisibles",
    "ray>=2.0",
]
all = [
    "nu[distributed]",
]

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build.targets.wheel]
packages = ["nu"]
