[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everybase"
version = "0.1.0"
description = "Term Programming platform — kernel, toolbox, and topologies"
readme = "../README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "attrs>=23.0.0",
]
keywords = ["term", "programming", "tree", "topology", "shape", "table", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
virtuals = ["eb-virtuals"]
rocksdb = ["rdbpython"]
distributed = ["eb-distributed"]
inmem = ["eb-dict"]
x = ["eb-math", "eb-fin", "eb-datetime", "eb-path", "eb-uuid"]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["everybase"]
