# Publishes the `nu` wheel to PyPI on a tag push like `nu@0.1.0`.
# Manual "Run workflow" dispatch builds but does NOT publish.
#
# `nu` tags own release semantics for the whole stack -- this workflow also
# creates a GitHub Release attached to the tag. Sibling wheels (nudle) and
# npm packages (ui-core, ui-kit) have their own tags but do not cut releases.
#
# Setup once (PyPI trusted publisher / OIDC, no secrets). Do this three times,
# once per project -- a trusted publisher is registered per PyPI project:
#   pypi.org -> account -> Publishing -> Add pending publisher
#     PyPI project name: nucore   (and again for: nustd, nucli)
#     Owner: nustackdev
#     Repository name: nu
#     Workflow name: publish-nu.yml
#     Environment name: (leave blank)
#
# Three distributions ship from one tag, in lockstep:
#   packages/nucore -> nucore  (kernel)
#   packages/nustd  -> nustd   (fabrics)
#   packages/nucli  -> nucli   (the `nu` command)
# All three must carry the same version.
#
# Each distribution builds into its own `dist/<name>/` and gets its own
# publish step. That is not cosmetic: the OIDC exchange mints a token scoped
# to a single PyPI project, so one upload call carrying three project names
# would 403 on the two that are out of scope. The steps run in dependency
# order -- nucore -> nustd -> nucli -- so each package resolves the moment it
# lands.
#
# Release flow:
#   1. Bump `version` in `packages/nucore/pyproject.toml`,
#      `packages/nustd/pyproject.toml` AND `packages/nucli/pyproject.toml`
#      (keep all three equal).
#   2. Commit and push to main.
#   3. `git tag nu@X.Y.Z && git push origin nu@X.Y.Z`.
name: Publish nu to PyPI

on:
  push:
    tags: ["nu@*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build only)"
        type: boolean
        default: false
      package:
        description: "Which distribution to publish"
        type: choice
        default: all
        options: [all, nucore, nustd, nucli]

permissions:
  contents: write   # needed to create the GitHub Release on tag push
  id-token: write   # needed for PyPI trusted publishing (OIDC)

concurrency:
  group: publish-nu
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install uv
        uses: astral-sh/setup-uv@v5

      - name: verify tag matches every package version
        if: startsWith(github.ref, 'refs/tags/nu@')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/nu@}"
          for PKG in packages/nucore packages/nustd packages/nucli; do
            PKG_VERSION=$(python -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb'))['project']['version'])" "$PKG/pyproject.toml")
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "tag nu@$TAG_VERSION does not match $PKG/pyproject.toml version $PKG_VERSION"
              exit 1
            fi
          done

      - name: build all distributions
        run: |
          uv build --package nucore --out-dir dist/nucore
          uv build --package nustd --out-dir dist/nustd
          uv build --package nucli --out-dir dist/nucli

      # One publish step per project: trusted publishing mints a token scoped
      # to a single PyPI project, so each upload must carry only that
      # project's artifacts. Ordered nucore -> nustd -> nucli so every
      # dependency is on the index before its dependent lands.
      # A tag push publishes all three. Manual dispatch can publish one at a
      # time, which is what bootstrapping needs: PyPI will not let you register
      # several pending publishers against the same workflow file at once, so
      # each project is registered and then published before the next one.
      - name: publish nucore
        if: >-
          startsWith(github.ref, 'refs/tags/nu@') ||
          (inputs.publish && contains(fromJSON('["all","nucore"]'), inputs.package))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/nucore

      - name: publish nustd
        if: >-
          startsWith(github.ref, 'refs/tags/nu@') ||
          (inputs.publish && contains(fromJSON('["all","nustd"]'), inputs.package))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/nustd

      - name: publish nucli
        if: >-
          startsWith(github.ref, 'refs/tags/nu@') ||
          (inputs.publish && contains(fromJSON('["all","nucli"]'), inputs.package))
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/nucli

      - name: build release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/nu@')
        run: |
          VERSION="${GITHUB_REF#refs/tags/nu@}"
          PREV=$(git tag -l 'nu@*' --sort=-v:refname | grep -v "^nu@${VERSION}$" | head -1)
          {
            echo "## Changelog"
            echo
            awk -v ver="$VERSION" '
              $0 ~ "^## "ver"( |$)" {flag=1; next}
              flag && /^## / {exit}
              flag {print}
            ' CHANGELOG.md
            if [ -n "$PREV" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...nu@${VERSION}"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: create github release
        if: startsWith(github.ref, 'refs/tags/nu@')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/**
