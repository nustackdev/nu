# .github/workflows/generate-api-docs.yml
name: Generate API Docs & Deploy
on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      
      - name: Merge main into docs branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if docs branch exists, create it if not
          if git ls-remote --heads origin docs | grep -q docs; then
            git checkout docs
            git merge main -m "Merge main into docs before updating documentation"
          else
            git checkout -b docs
          fi
      
      - name: Generate API docs
        run: |
          poetry install
          cd docs/scripts/api_ref
          poetry run python generate.py
      
      - name: Commit and push to docs branch
        run: |
          git add docs/
          git commit -m "Update API documentation [skip ci]" || echo "No changes to commit"
          git push origin docs