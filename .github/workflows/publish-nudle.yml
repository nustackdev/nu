# Publishes the `nudle` wheel to PyPI on a tag push like `nudle@0.1.0`.
# Manual "Run workflow" dispatch builds but does NOT publish.
#
# The wheel has no source of its own: its whole payload is the Vite SPA, which
# lives in a different directory. Build order: `npm run build` in the ts
# workspace produces `pkgs/ts/nudle/dist/`, then hatchling force-includes that
# into `pkgs/nudle`'s wheel at `nudle/build/`.
#
# Setup once (PyPI trusted publisher / OIDC, no secrets):
#   pypi.org -> account -> Publishing -> Add pending publisher
#     PyPI project name: nudle
#     Owner: nustackdev
#     Repository name: nu
#     Workflow name: publish-nudle.yml
#     Environment name: (leave blank)
#
# Release flow:
#   1. Bump `version` in both `pkgs/nudle/pyproject.toml` (the wheel) and
#      `pkgs/ts/nudle/package.json` (the app). Keep them equal.
#   2. Commit and push to main.
#   3. `git tag nudle@X.Y.Z && git push origin nudle@X.Y.Z`.
name: Publish nudle to PyPI

on:
  push:
    tags: ["nudle@*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # PyPI trusted publishing (OIDC)

concurrency:
  group: publish-nudle
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pkgs/ts/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install js deps
        working-directory: pkgs/ts
        run: npm ci

      - name: build spa
        working-directory: pkgs/ts
        run: npm run build --workspace nudle-web

      - name: install python build backend
        run: python -m pip install --upgrade build

      - name: verify tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/nudle@')
        working-directory: pkgs/nudle
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/nudle@}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag nudle@$TAG_VERSION does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: build wheel
        working-directory: pkgs/nudle
        # --wheel skips the sdist step. sdist would strip the force-included
        # `../ts/nudle/dist` (gitignored, and outside this project besides),
        # and the wheel-from-sdist path would then fail the lookup.
        run: python -m build --wheel --outdir wheel-dist

      - name: publish
        if: startsWith(github.ref, 'refs/tags/nudle@')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkgs/nudle/wheel-dist
