[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nu-mem"
version = "0.1.0"
description = "Nu Shapes fabric adapter for in-memory state — backed by plain nested Python dicts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "nu>=0.1.0",
]
keywords = ["nu", "shapes", "in-memory", "refs", "adapter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build.targets.wheel]
packages = ["src/nu_mem"]
