[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nu-distributed"
version = "0.1.0"
description = "Distributed execution adapters for everybase — Ray + invisibles"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "composables>=0.1.0",
    "invisibles>=0.1.0",
    "ray>=2.0",
]

keywords = ["distributed", "rpc", "invisibles", "ray"]

[tool.uv.sources]
composables = { path = "../../../composables", editable = true }
invisibles = { path = "../../../invisibles", editable = true }

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build.targets.wheel]
packages = ["src/nu_distributed"]
