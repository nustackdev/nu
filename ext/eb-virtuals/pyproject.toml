[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eb-virtuals"
version = "0.1.0"
description = "Virtuals adapter for everybase — refs over KV storages"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "everybase>=0.1.0",
    "virtuals-py",
]
keywords = ["every", "virtuals", "refs", "kv", "views"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[project.optional-dependencies]
rocksdb = ["rdbpython"]
redis = ["redis"]
msgpack = ["msgpack"]

[tool.hatch.build.targets.wheel]
packages = ["src/eb_virtuals"]
