[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eb-dict"
version = "0.1.0"
description = "Dict adapter for everybase — shapes backed by plain Python dicts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "everybase>=0.1.0",
]
keywords = ["every", "dict", "refs", "adapter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[project.optional-dependencies]
extended = ["eb-math", "eb-datetime", "eb-fin", "eb-path", "eb-uuid"]

[tool.hatch.build.targets.wheel]
packages = ["src/eb_dict"]
