[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nu-inspect"
version = "0.1.0"
description = "Inspection tools for Nu trees and Shapes - terminal, HTML, and execution trace"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "nu>=0.1.0",
]
keywords = ["nu", "inspect", "devtools", "tree", "shape"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build]
artifacts = ["src/nu_inspect/explorer.html.tmpl"]

[tool.hatch.build.targets.wheel]
packages = ["src/nu_inspect"]
