[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everybase"
version = "0.1.0"
description = "Core library for the every ecosystem — abstract contracts and base implementations"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "attrs>=23.0.0",
]
keywords = ["ast", "tree", "transform", "traversal", "query", "types", "morphisms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["src/everybase"]
