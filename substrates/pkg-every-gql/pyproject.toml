[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "every-gql"
version = "0.1.0"
description = "GraphQL substrate for everybase - schema-driven graph traversal and mutations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["everybase>=0.1.0"]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["src/every_gql"]
