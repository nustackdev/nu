[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eb-notion"
version = "0.1.0"
description = "Notion integration for everybase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "everybase>=0.1.0",
    "attrs>=23.0.0",
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eb_notion"]
