[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "every-kv"
version = "0.1.0"
description = "Key-value storage abstractions for everybase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "everyabc>=0.1.0"
]

[project.optional-dependencies]
rocksdb = ["rdbpython"]
redis = ["redis"]

[tool.hatch.build.targets.wheel]
packages = ["src/every_kv"]
