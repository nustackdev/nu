[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel that carries the compiled SPA. It has no source of its own: the
# whole payload is the vite output of `pkgs/ts/nudle`, built there and landed
# here under `nudle/build/`. A separate distribution because a SPA rebuilt on
# every UI tweak would eat the nustd wheel's PyPI quota.
#
# `nustd.ws_server` resolves it at runtime as `nudle.__path__[0] / "build"`.
[project]
name = "nudle"
version = "0.1.4"
description = "nudle web bundle -- compiled UI assets for the nustd.ui fabric"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build.targets.wheel]
packages = ["src/nudle"]
# `src/nudle/build` is a symlink to the vite output, so an editable install
# finds the SPA without a wheel build. Exclude it from the package walk to
# avoid a double-add; the force-include below places the real `dist/` contents
# at the wheel path `nudle/build/`.
exclude = ["src/nudle/build"]

[tool.hatch.build.targets.wheel.force-include]
"../ts/nudle/dist" = "nudle/build"
