# =============================================================================
# packages/eb-shape-lens - Terminal data viewer for Shapes
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eb-shape-lens"
version = "0.1.0"
description = "Terminal data viewer for everybase Shapes"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "everyshape>=0.1.0",
]
keywords = ["every", "shape", "lens", "viewer", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["src/eb_shape_lens"]
