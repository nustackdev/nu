# =============================================================================
# packages/every-dict - Dict Substrate
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "every-dict"
version = "0.1.0"
description = "Dict-based substrate for everybase - plain nested dicts as data bags"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "everybase>=0.1.0",
    "everyshape>=0.1.0",
]
keywords = ["every", "dict", "substrate", "document", "model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["src/every_dict"]
