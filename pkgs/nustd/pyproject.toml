[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nustd"
version = "0.9.0"
description = "Batteries for nu: the fabrics (kv, blob, queue, service, llm, acp, http, proxy, mp, cluster, valkey, ws_server, ui) and the standard library, imported as nustd."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
# Released in lockstep with the kernel. This wheel carries no `nu/__init__.py`
# -- it drops its subpackages into the `nu.` namespace the kernel owns.
dependencies = [
    "nucore>=0.9.0",
]
keywords = [
    "nu",
    "nustack",
    "python",
    "state-management",
    "distributed-systems",
    "ai-agents",
    "agentic",
    "ray",
    "llm",
    "database",
    "key-value-store",
    "rocksdb",
    "ui",
    "real-time",
    "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# One extra per fabric; name matches the `nu.<fabric>` import path.
# `nustd` and `nustd.service` need nothing beyond the kernel, so they have no
# extra. `mp` is stdlib multiprocessing -- the extra exists only so
# `nustd[mp]` is not an error.
[project.optional-dependencies]
kv = [
    "virtuals-py>=0.2.2",
]
queue = [
    "janus>=2.0,<3",
]
# `nustd.ws_server` is the bare connection lifecycle: no wire format, no SPA.
ws_server = [
    "starlette>=0.37.2",
    # websockets-sansio, the protocol the server pins: uvicorn 0.35, on websockets 11.
    "uvicorn>=0.35.0",
    "websockets>=11.0",
]
# `nustd.ui` stacks its own wire codec and the nudle SPA wheel on that.
ui = [
    "nustd[ws_server]",
    "msgpack>=1.1.2",
    "nudle>=0.1.15",
]
# `nustd.cluster` runs on ray. (Was the `ray` extra on nucore <= 0.1.18.)
cluster = [
    "ray>=2.50; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "ray>=2.0,<2.50; sys_platform == 'darwin' and platform_machine != 'arm64'",
]
proxy = [
    "invisibles-py",
]
http = [
    "httpx>=0.27",
]
llm = [
    "httpx>=0.27",
]
# `nustd.acp` drives coding agents (Claude Code, Codex, Gemini, ...) over ACP v1.
acp = [
    "agent-client-protocol>=1.0,<1.1",
]
mp = []
# `nustd.valkey` spawns the Valkey server binary this wheel bundles.
valkey = [
    "valkeylite>=9.1.2",
]
# `nustd.blob`'s default backend; the files backend needs nothing. Serving a
# store over http (`nustd.blob.http.serve_blobs`) takes Starlette from `ws_server`.
blob = [
    "lmdb>=1.4",
]
# `nustd.blob`'s s3 backend: any S3-compatible service (AWS, R2, MinIO).
blob_s3 = [
    "boto3>=1.35",
]
all = [
    "nustd[kv]",
    "nustd[queue]",
    "nustd[ws_server]",
    "nustd[ui]",
    "nustd[cluster]",
    "nustd[proxy]",
    "nustd[http]",
    "nustd[llm]",
    "nustd[acp]",
    "nustd[mp]",
    "nustd[valkey]",
    "nustd[blob]",
    "nustd[blob_s3]",
    # Every kv backend: rocksdb, lmdb, redis. 0.1.8 is where virtuals' own
    # `all` started meaning the backends rather than its dev tooling.
    "virtuals-py[all]>=0.2.2",
]

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build.targets.wheel]
packages = ["src/nustd"]
