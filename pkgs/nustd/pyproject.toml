[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nustd"
version = "0.5.1"
description = "Batteries for Nu: the fabrics (mem, kv, service, llm, cc, http, proxy, mp, mp_pool, cluster, ws_server, ui) and the standard library, imported as nustd."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
# Released in lockstep with the kernel. This wheel carries no `nu/__init__.py`
# -- it drops its subpackages into the `nu.` namespace the kernel owns.
dependencies = [
    "nucore>=0.5.1",
]
keywords = [
    "nu",
    "nustack",
    "python",
    "state-management",
    "distributed-systems",
    "ai-agents",
    "agentic",
    "ray",
    "llm",
    "database",
    "key-value-store",
    "rocksdb",
    "ui",
    "real-time",
    "observability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# One extra per fabric; name matches the `nu.<fabric>` import path.
# `nustd` and `nustd.service` need nothing beyond the kernel, so they have no
# extra. `mp` is stdlib multiprocessing -- the extra exists only so
# `nustd[mp]` is not an error.
[project.optional-dependencies]
kv = [
    "virtuals-py>=0.1.2",
]
mem = [
    "janus>=2.0.0",
]
# `nustd.ws_server` is the bare connection lifecycle: no wire format, no SPA.
ws_server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "watchfiles>=0.24.0",
]
# `nustd.ui` stacks its own wire codec and the nudle SPA wheel on that.
ui = [
    "nustd[ws_server]",
    "msgpack>=1.1.2",
    "nudle>=0.1.1",
]
# `nustd.cluster` runs on ray. (Was the `ray` extra on nucore <= 0.1.18.)
cluster = [
    "ray>=2.50; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "ray>=2.0,<2.50; sys_platform == 'darwin' and platform_machine != 'arm64'",
]
proxy = [
    "invisibles-py",
]
http = [
    "httpx>=0.27",
]
llm = [
    "httpx>=0.27",
]
cc = [
    "claude-agent-sdk>=0.1.0",
]
mp = []
# `nustd.mp_pool` is stdlib multiprocessing too; the extra exists for symmetry.
mp_pool = []
all = [
    "nustd[kv]",
    "nustd[mem]",
    "nustd[ws_server]",
    "nustd[ui]",
    "nustd[cluster]",
    "nustd[proxy]",
    "nustd[http]",
    "nustd[llm]",
    "nustd[cc]",
    "nustd[mp]",
    "nustd[mp_pool]",
    # Every kv backend: rocksdb, lmdb, redis. 0.1.8 is where virtuals' own
    # `all` started meaning the backends rather than its dev tooling.
    "virtuals-py[all]>=0.1.8",
]

[project.urls]
Repository = "https://github.com/nustackdev/nu"

[tool.hatch.build.targets.wheel]
packages = ["src/nustd"]
