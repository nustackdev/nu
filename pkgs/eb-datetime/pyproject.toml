[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eb-datetime"
version = "0.1.0"
description = "Datetime types for everybase (datetime, date, time, timedelta, timezone)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "everybase>=0.1.0",
]
keywords = ["every", "datetime", "date", "time", "timedelta", "timezone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["src/eb_datetime"]
