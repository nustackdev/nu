# =============================================================================
# std/every_pv - Polymorphic View Refs
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "every-pv"
version = "0.1.0"
description = "Specialized refs for polymorphic views over KV storages"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "everyabc>=0.1.0",
    "everybase>=0.1.0",
    "everyshape>=0.1.0",
    "pv",
    "tkv>=0.1.0",
]
keywords = ["every", "pv", "refs", "kv", "polymorphic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[project.optional-dependencies]
rocksdb = ["rdbpython"]
redis = ["redis"]
msgpack = ["msgpack"]

[tool.uv.sources]
pv = { git = "https://github.com/everyabc/pv" }
tkv = { git = "https://github.com/everyabc/tkv" }

[tool.hatch.build.targets.wheel]
packages = ["src/every_pv"]
