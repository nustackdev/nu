[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everygraph"
version = "0.1.0"
description = "Graph substrate for everybase - nodes, edges, and traversals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["everybase>=0.1.0"]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["src/everygraph"]
