# =============================================================================
# std/every_flow_ext - Flow Extensions & Tree Meta-transforms
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "every-flow-ext"
version = "0.1.0"
description = "Flow extensions and tree meta-transforms for everyabc"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "everyabc>=0.1.0",
    "every-flow>=0.1.0",
]
keywords = ["every", "flow", "cancellation", "checkpoint", "logging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["src/every_flow_ext"]
