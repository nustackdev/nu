# =============================================================================
# std/every_view - Standard Views for PV
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "every-view"
version = "0.1.0"
description = "Standard view implementations for polymorphic views"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["pv"]
keywords = ["every", "pv", "views", "kv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.uv.sources]
pv = { git = "https://github.com/everyabc/pv" }

[tool.hatch.build.targets.wheel]
packages = ["src/every_view"]
