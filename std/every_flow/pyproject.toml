# =============================================================================
# std/every_flow - Flow Primitives
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "every-flow"
version = "0.1.0"
description = "Common flow primitives for everybase (control, parallel, timing, iteration, reactive, error handling, i/o, profiling)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "every>=0.1.0",
    "everybase>=0.1.0",
]
keywords = ["every", "flow", "control-flow", "parallel", "reactive", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/everyabc/everybase"

[tool.hatch.build.targets.wheel]
packages = ["src/every_flow"]
