# =============================================================================
# Root pyproject.toml - Monorepo Workspace (Virtual)
# =============================================================================
# This is a virtual workspace root - not a package itself.
# Individual packages are in core-* and pkg-* directories.
# =============================================================================

[project]
name = "everybase-workspace"
version = "0.0.0"
description = "Term Programming platform - monorepo workspace"
requires-python = ">=3.10"
dependencies = ["everybase", "everyshape", "everytable", "every-datetime", "every-dict", "every-fin", "every-flow", "every-flow-ext", "every-math", "every-notion", "every-path", "every-pv", "every-uuid"]

# =============================================================================
# UV Workspace
# =============================================================================
[tool.uv.workspace]
members = [
    "everybase",
    "pkg-every-shape",
    "pkg-every-table",
    "pkg-every-datetime",
    "pkg-every-dict",
    "pkg-every-fin",
    "pkg-every-flow",
    "pkg-every-flow-ext",
    "pkg-every-math",
    "pkg-every-notion",
    "pkg-every-path",
    "pkg-every-pv",

    "pkg-every-uuid",
]

[tool.uv.sources]
everybase = { workspace = true }
every-datetime = { workspace = true }
every-dict = { workspace = true }
every-fin = { workspace = true }
every-flow = { workspace = true }
every-flow-ext = { workspace = true }
every-math = { workspace = true }
every-notion = { workspace = true }
every-path = { workspace = true }
every-pv = { workspace = true }
every-uuid = { workspace = true }
everyshape = { workspace = true }
everytable = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "pytest-asyncio>=1.3.0",
]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["everybase", "pkg-every-shape", "pkg-every-table", "pkg-every-datetime", "pkg-every-dict", "pkg-every-fin", "pkg-every-flow", "pkg-every-flow-ext", "pkg-every-math", "pkg-every-notion", "pkg-every-path", "pkg-every-pv", "pkg-every-uuid"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["everybase", "pkg-every-shape", "pkg-every-table", "pkg-every-datetime", "pkg-every-dict", "pkg-every-fin", "pkg-every-flow", "pkg-every-flow-ext", "pkg-every-math", "pkg-every-notion", "pkg-every-path", "pkg-every-pv", "pkg-every-uuid"]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "reports/coverage"

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["everybase", "pkg-every-shape", "pkg-every-table", "pkg-every-datetime", "pkg-every-dict", "pkg-every-fin", "pkg-every-flow", "pkg-every-flow-ext", "pkg-every-math", "pkg-every-notion", "pkg-every-path", "pkg-every-pv", "pkg-every-uuid"]
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "YTT",    # flake8-2020
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "TC",     # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-pathlib
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__ (covered by class docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",   # assert allowed in tests
    "S108",   # /tmp usage allowed in tests
    "T20",    # print allowed in tests
    "D",      # docstrings not required in tests
    "E711",
    "E712",
    "ANN",    # type annotations not required in tests
    "N806",   # disable variable name checks
]
"**/testing/**/*.py" = [
    "S101",
    "T20",
    "D",
    "E711",
    "E712",
    "ANN",
    "N806",
    "B017",
]
"_examples/**/*.py" = [
    "S101",
    "T20",
    "D",
    "ANN",
]
"pkg-every-flow/**/*.py" = [
    "ANN401",  # Any type needed for polymorphic ref/value parameters
]
"pkg-every-flow-ext/**/*.py" = [
    "ANN401",  # Any type needed for polymorphic ref/value parameters
]
"pkg-every-notion/**/*.py" = [
    "ANN401",  # Any type needed for Notion's dynamic JSON API
    "D107",    # __init__ docstrings covered by class docstring
]

[tool.ruff.lint.isort]
known-first-party = ["everybase", "everyshape", "everytable", "every_datetime", "every_dict", "every_fin", "every_flow", "every_flow_leg", "every_flow_ext", "every_math", "every_notion", "every_path", "every_pv", "every_uuid"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
]

# ============================================================================
# Security
# ============================================================================
[tool.bandit]
exclude_dirs = ["_examples/", "_docs/"]
