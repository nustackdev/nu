# =============================================================================
# Root pyproject.toml - Monorepo Workspace (Virtual)
# =============================================================================
# This is a virtual workspace root - not a package itself.
# Individual packages are in core/ and pkgs/ directories.
# =============================================================================

[project]
name = "everybase-workspace"
version = "0.0.0"
description = "Term Programming platform - monorepo workspace"
requires-python = ">=3.10"
dependencies = ["everybase", "everyshape", "everytable", "everystream", "everypv", "everydict", "everygraph", "eb-datetime", "eb-fin", "eb-math", "eb-path", "eb-uuid", "eb-shape-lens", "eb-tree-view"]

# =============================================================================
# UV Workspace
# =============================================================================
[tool.uv.workspace]
members = [
    # Core
    "core/everybase",
    "core/everyshape",
    "core/everytable",
    "core/everystream",
    "core/everypv",
    "core/everydict",
    "core/everygraph",

    # Packages — types
    "pkgs/eb-datetime",
    "pkgs/eb-fin",
    "pkgs/eb-math",
    "pkgs/eb-path",
    "pkgs/eb-uuid",

    # Packages — tools
    "pkgs/eb-shape-lens",
    "pkgs/eb-tree-view",
]

[tool.uv.sources]
# Core
everybase = { workspace = true }
everyshape = { workspace = true }
everytable = { workspace = true }
everystream = { workspace = true }
everypv = { workspace = true }
everydict = { workspace = true }
everygraph = { workspace = true }
# Packages
eb-datetime = { workspace = true }
eb-fin = { workspace = true }
eb-math = { workspace = true }
eb-path = { workspace = true }
eb-uuid = { workspace = true }
eb-shape-lens = { workspace = true }
eb-tree-view = { workspace = true }
# In-house libs (local editable)
pv = { path = "../pv", editable = true }
tkv = { path = "../tkv", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "pytest-asyncio>=1.3.0",
]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["core/everybase", "core/everyshape", "core/everytable", "core/everystream", "core/everypv", "pkgs/eb-datetime", "pkgs/eb-fin", "pkgs/eb-math", "pkgs/eb-path", "pkgs/eb-uuid"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["core/everybase", "core/everyshape", "core/everytable", "core/everystream", "core/everypv", "pkgs/eb-datetime", "pkgs/eb-fin", "pkgs/eb-math", "pkgs/eb-path", "pkgs/eb-uuid"]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "reports/coverage"

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core/everybase", "core/everyshape", "core/everytable", "core/everystream", "core/everypv", "pkgs/eb-datetime", "pkgs/eb-fin", "pkgs/eb-math", "pkgs/eb-path", "pkgs/eb-uuid"]
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "YTT",    # flake8-2020
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "TC",     # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-pathlib
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__ (covered by class docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",   # assert allowed in tests
    "S108",   # /tmp usage allowed in tests
    "T20",    # print allowed in tests
    "D",      # docstrings not required in tests
    "E711",
    "E712",
    "ANN",    # type annotations not required in tests
    "N806",   # disable variable name checks
]
"**/testing/**/*.py" = [
    "S101",
    "T20",
    "D",
    "E711",
    "E712",
    "ANN",
    "N806",
    "B017",
]
"examples/**/*.py" = [
    "S101",
    "T20",
    "D",
    "ANN",
]
"benchmarks/**/*.py" = [
    "S101",
    "T20",
    "D",
    "ANN",
    "B007",
]
"**/abc/flows/**/*.py" = [
    "ANN401",  # Any type needed for polymorphic flow parameters
]
"**/flows/reactive.py" = [
    "ANN401",  # Any type needed for polymorphic flow parameters
]

[tool.ruff.lint.isort]
known-first-party = ["everybase", "everyshape", "everytable", "everystream", "everypv", "eb_datetime", "eb_fin", "eb_math", "eb_path", "eb_uuid", "eb_shape_lens", "eb_tree_view"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
]

# ============================================================================
# Security
# ============================================================================
[tool.bandit]
exclude_dirs = ["examples/", "docs/"]
