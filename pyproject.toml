# ============================================================================
# Build System
# ============================================================================
[build-system]
requires = ["setuptools>=68.0", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Project Metadata (PEP 621)
# ============================================================================
[project]
name = "redwood"
version = "0.4.0"
description = "Persistent reactive trees for Python with multiple storage backends"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Gor Arakelyan", email = "gorarkln@gmail.com"}
]
maintainers = [
    {name = "Gor Arakelyan", email = "gorarkln@gmail.com"}
]
keywords = [
    "storage",
    "sqlite",
    "rocksdb",
    "database",
    "persistence",
    "reactive",
    "reactivity",
    "tree",
    "cython"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/loomi-lab/redwood"
Documentation = "https://github.com/loomi-lab/redwood#readme"
Repository = "https://github.com/loomi-lab/redwood"
Issues = "https://github.com/loomi-lab/redwood/issues"
Changelog = "https://github.com/loomi-lab/redwood/releases"

[project.optional-dependencies]
# RocksDB backend support (binary wheels available)
rocksdb = []  # rwrocks is included in main package

# Development tools
dev = [
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

# Testing
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
]

# Cython build dependencies (for building from source)
cython = [
    "Cython>=3.0.0",
    "setuptools>=68.0",
]

# All development dependencies
all = [
    "redwood[dev,test,cython]",
]

# ============================================================================
# Package Discovery
# ============================================================================
[tool.setuptools]
# Let setuptools find packages automatically
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["redwood*", "rwtup*", "rwrocks*", "rwstd*"]
namespaces = false

[tool.setuptools.package-data]
# Include all necessary files for each package
redwood = [
    "py.typed",
]
rwtup = [
    "**/*.pyx",
    "**/*.pxd",
    "**/*.hpp",
    "py.typed",
]
rwrocks = [
    "**/*.pyx",
    "**/*.pxd",
    "**/*.hpp",
    "py.typed",
]
rwstd = [
    "py.typed",
]

# Include C++ headers for rwrocks in source distributions
[tool.setuptools.exclude-package-data]
"*" = ["*.c", "*.cpp"]  # Exclude generated C/C++ files

# ============================================================================
# CI/CD - cibuildwheel configuration
# ============================================================================
[tool.cibuildwheel]
# Build wheels for Python 3.9-3.13
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*"]

# Skip builds we don't need
skip = [
    "*-musllinux_*",      # Alpine Linux (different libc)
    "*-win32",            # 32-bit Windows
    "*-manylinux_i686",   # 32-bit Linux
]

# Build verbosity
build-verbosity = 1

# Test the wheels after building
test-command = "python -c \"import rwrocks; print('rwrocks version:', rwrocks.__version__)\""
test-requires = ["pytest"]

# ============================================================================
# Linux-specific cibuildwheel settings
# ============================================================================
[tool.cibuildwheel.linux]
# Use manylinux2014 for broad compatibility
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

# Build RocksDB and dependencies before building wheels
before-all = [
    "yum install -y wget gcc gcc-c++ make",
    "bash {project}/scripts/build-rocksdb-linux.sh"
]

# Set environment variables for the build
environment = { RWROCKS_DEP_DIR="/tmp/rwrocks_deps", LD_LIBRARY_PATH="/tmp/rwrocks_deps/lib:$LD_LIBRARY_PATH" }

# Additional test command to verify RocksDB functionality
test-command = [
    "python -c \"import rwrocks; print('rwrocks imported successfully')\"",
    "python -c \"import rwrocks; db = rwrocks.DB('/tmp/test.db', rwrocks.Options(create_if_missing=True)); db.put(b'key', b'value'); assert db.get(b'key') == b'value'; print('RocksDB basic test passed')\""
]

# ============================================================================
# macOS-specific cibuildwheel settings
# ============================================================================
[tool.cibuildwheel.macos]
# Build for both Intel and Apple Silicon
archs = ["x86_64", "arm64"]

# Minimum macOS version to support
environment = { MACOSX_DEPLOYMENT_TARGET="10.14", RWROCKS_DEP_DIR="/tmp/rwrocks_deps", DYLD_LIBRARY_PATH="/tmp/rwrocks_deps/lib:$DYLD_LIBRARY_PATH" }

# Build RocksDB and dependencies before building wheels
before-all = [
    "bash {project}/scripts/build-rocksdb-macos.sh"
]

# Repair wheel command (bundle dylibs)
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

# Test the wheels
test-command = [
    "python -c \"import rwrocks; print('rwrocks imported successfully')\"",
    "python -c \"import rwrocks; db = rwrocks.DB('/tmp/test_macos.db', rwrocks.Options(create_if_missing=True)); db.put(b'key', b'value'); assert db.get(b'key') == b'value'; print('RocksDB basic test passed')\""
]

# ============================================================================
# Windows-specific cibuildwheel settings
# ============================================================================
[tool.cibuildwheel.windows]
# Build RocksDB using vcpkg (Windows is more complex)
before-all = [
    "powershell -File {project}/scripts/build-rocksdb-windows.ps1"
]

# Set environment for Windows builds
environment = { RWROCKS_DEP_DIR="C:\\rwrocks_deps" }

# Test the wheels
test-command = [
    "python -c \"import rwrocks; print('rwrocks imported successfully')\"",
]

# ============================================================================
# Testing - pytest
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--durations=10",
]
markers = [
    # Test type markers
    "unit: Unit tests - fast, isolated",
    "functional: Functional end-to-end tests",
    "integration: Integration tests - cross-component",
    "performance: Performance benchmarks",
    # Package markers
    "redwood: Tests for core redwood package",
    "rwrocks: Tests for RocksDB bindings",
    "rwstd: Tests for standard library utils",
    "rwtup: Tests for tuple codec",
    # Legacy/specific markers
    "codec: Codec-specific tests",
    "rocksdb: RocksDB-specific tests",
    "slow: Slow-running tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "tests/reports/coverage"

# ============================================================================
# Linting & Formatting - Ruff
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    "*.c",
    "*.cpp",
    "*.so",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "YTT",    # flake8-2020
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "TC",     # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-pathlib
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D105",   # Missing docstring in magic method
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Use Google style format

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert allowed in tests
    "T20",    # print allowed in tests
    "D",      # docstrings not required in tests
]
"examples/**/*.py" = [
    "S101",   # assert allowed in examples
    "T20",    # print allowed in examples
    "D",      # docstrings not required in examples
]
"setup.py" = [
    "T20",    # print allowed in setup
    "D",      # docstrings not required in setup
]
"src/rwrocks/**/*.py" = [
    "D",      # Some docstrings may be in .pyx files
]

[tool.ruff.lint.isort]
known-first-party = ["redwood", "rwtup", "rwrocks", "rwstd"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true         # Format code blocks in docstrings
docstring-code-line-length = 80      # Shorter lines in docstring examples

# ============================================================================
# Type Checking - mypy
# ============================================================================
[tool.mypy]
python_version = "3.12"  # Match minimum supported version
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
    ".*\\.pyx$",  # Ignore Cython files
]

# Per-module options
[[tool.mypy.overrides]]
module = "rwrocks.*"
ignore_errors = true  # Cython modules have type stubs but may not be perfect
