# =============================================================================
# Root pyproject.toml - Monorepo Workspace (Virtual)
# =============================================================================
# This is a virtual workspace root - not a package itself.
# Individual packages are in abc/, std/, and pkgs/ directories.
# =============================================================================

[project]
name = "everybase-workspace"
version = "0.0.0"
description = "Term Programming platform - monorepo workspace"
requires-python = ">=3.10"
dependencies = ["every", "everybase", "every-pv", "every-view", "every-adapters"]

# =============================================================================
# UV Workspace
# =============================================================================
[tool.uv.workspace]
members = [
    "abc/every",
    "abc/everybase",
    "std/every_pv",
    "std/every_view",
    "pkgs/every_adapters",
]

[tool.uv.sources]
every = { workspace = true }
everybase = { workspace = true }
every-pv = { workspace = true }
every-view = { workspace = true }
every-adapters = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests", "abc", "std", "pkgs"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["abc", "std", "pkgs"]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "tests/reports/coverage"

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["abc", "std", "pkgs", "tests"]
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "YTT",    # flake8-2020
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "TC",     # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-pathlib
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D105",   # Missing docstring in magic method
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",   # assert allowed in tests
    "T20",    # print allowed in tests
    "D",      # docstrings not required in tests
    "E711",
    "E712",
    "ANN",    # type annotations not required in tests
    "N806",   # disable variable name checks
]
"**/testing/**/*.py" = [
    "S101",
    "T20",
    "D",
    "E711",
    "E712",
    "ANN",
    "N806",
    "B017",
]
"examples/**/*.py" = [
    "S101",
    "T20",
    "D",
    "ANN",
]

[tool.ruff.lint.isort]
known-first-party = ["every", "everybase", "every_pv", "every_view", "every_adapters"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
]

# ============================================================================
# Security
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests/", "examples/", "docs/"]
