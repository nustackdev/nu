[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loomi"
version = "0.1.1"
description = "loomi"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"loomi" = "src/loomi", "loomistd" = "pkgs/loomistd", "loomiverse" = "pkgs/loomiverse", "loomi_stubs" = "stubs/loomi_stubs", "loomistd_stubs" = "stubs/loomistd_stubs", "loomiverse_stubs" = "stubs/loomiverse_stubs"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "pkgs", "stubs"]
include = ["loomi*"]

[tool.setuptools.package-data]
"loomi" = ["py.typed", "*.yaml", "*.json"]
"loomistd" = ["py.typed", "*.yaml", "*.json"]
"loomiverse" = ["py.typed", "*.yaml", "*.json"]
"loomi_stubs" = ["**/*.pyi"]
"loomistd_stubs" = ["**/*.pyi"]
"loomiverse_stubs" = ["**/*.pyi"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
known_first_party = ["loomi", "loomistd", "loomiverse"]

[tool.autoflake]
check = false
recursive = true
remove_all_unused_imports = true
ignore_init_module_imports = true
remove_unused_variables = true
ignore_pass_statements = false
ignore_pass_after_docstring = true
in_place = true
