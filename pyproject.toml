[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "loomi"
version = "0.2.0"
description = "loomi"
authors = ["Gor Arakelyan <gorarkln@gmail.com>"]
readme = "README.md"
packages = [
    { include = "loomi", from = "src" },
    { include = "loomistd", from = "pkgs" },
    { include = "loomiverse", from = "pkgs" },
]
include = [
    "src/loomi/py.typed",
    "src/loomi/**/*.yaml",
    "src/loomi/**/*.json",
    "pkgs/loomistd/py.typed",
    "pkgs/loomistd/**/*.yaml",
    "pkgs/loomistd/**/*.json",
    "pkgs/loomiverse/py.typed",
    "pkgs/loomiverse/**/*.yaml",
    "pkgs/loomiverse/**/*.json",
    "stubs/**/*.pyi"
]

[tool.poetry.dependencies]
python = "^3.12"
rich = "^13.9.4"
aiofile = "^3.9.0"
pydantic = "^2.10.6"
lmdb = "^1.6.2"
aiohttp = "^3.11.13"
requests = "^2.32.3"
pre-commit = "^4.1.0"
networkx = "^3.4.2"

[tool.poetry.group.dev.dependencies]
autoflake = "*"
black = "*"
flake8 = "*"
isort = "*"
mypy = "*"
pre-commit = "*"
pyinstrument = "^5.0.1"
matplotlib = "^3.10.1"
scipy = "^1.15.2"
mermaid-py = "^0.7.1"
streamlit = "^1.44.1"
streamlit-flow-component = "^1.6.1"
graphviz = "^0.20.3"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
known_first_party = ["loomi", "loomistd", "loomiverse"]

[tool.autoflake]
check = false
recursive = true
remove_all_unused_imports = true
ignore_init_module_imports = true
remove_unused_variables = true
ignore_pass_statements = false
ignore_pass_after_docstring = true
in_place = true
