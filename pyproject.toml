# =============================================================================
# nu — Term Programming platform
# =============================================================================
# One package: kernel, stdlib, fabrics (nu.virtuals / nu.mem / nu.ui), and
# topologies (nu.distributed). Source lives under src/nu (src layout). Extras
# are opt-in; the `local` dependency group pulls the full cluster dev closure
# by default.
#
# Layout under `src/nu/ui/`:
# - `py/`      -- python side of the fabric (widget kit under `py/refs/`)
# - `ts/`      -- ts side (npm packages: `core`, `kit`)
# - `nudle/`   -- the nudle dashboard app hosting the fabric. Own py/ + ts/
#                 split; `nudle/ts` also contains the sibling PyPI wheel
#                 (name: `nudle`) that ships the compiled SPA -- kept out of
#                 the main `nu` wheel so releases stay lean.
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nu"
version = "0.1.0"
description = "Term Programming platform — kernel, toolbox, and topologies"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gor Arakelyan", email = "gorarkln@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "attrs>=23.0.0",
]
keywords = ["term", "programming", "tree", "topology", "shape", "table", "graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
# Fabrics — accessed as nu.virtuals / nu.mem / nu.ui (not exposed on the top-level nu namespace).
virtuals = [
    "virtuals-py",
]
mem = [
    "janus>=2.0.0",
]
nudle = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "msgpack>=1.1.2",
    "watchfiles>=0.24.0",
    "nudle==0.2.0",
]
default = [
    "nu[virtuals]",
    "nu[mem]",
]
infra = [
    "nu[default]",
    "virtuals-py[rocksdb]",
    "redis",
]
distributed = [
    "nu[infra]",
    "invisibles-py",
    "ray>=2.0",
]
all = [
    "nu[distributed]",
    "nu[nudle]",
]

[project.urls]
Repository = "https://github.com/nustackdev/nu"

# =============================================================================
# Hatch — src layout; frontend subtree excluded (packaged as sibling `nudle` wheel)
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/nu"]
exclude = [
    "src/nu/ui/ts/**",
    "src/nu/ui/nudle/ts/**",
    "src/nu/ui/package.json",
    "src/nu/ui/biome.json",
    "src/nu/ui/.gitignore",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/nu/ui/**/node_modules",
    "src/nu/ui/**/dist",
]

# =============================================================================
# UV — local sources + dev closure
# =============================================================================
[tool.uv.sources]
nudle = { path = "./src/nu/ui/nudle/ts", editable = true }
virtuals-py = { path = "../virtuals", editable = true }
invisibles-py = { path = "../invisibles", editable = true }
kh57 = { path = "../kh57", editable = true }

[tool.uv]
# Bare `uv sync` provisions the full dev env: the distributed stack + tooling.
# Use `--no-group local` for a lean install, `--group examples` for aiohttp.
default-groups = ["dev", "local"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "pytest-asyncio>=1.3.0",
]
examples = [
    "aiohttp",
]
local = [
    "nu[distributed]",
    "nu[nudle]",
]

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# Make the nu test-support package importable as `_support.<module>` from any
# test file under tests/nu/. The leading underscore keeps pytest from
# auto-collecting it as tests.
pythonpath = [
    "tests/nu",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
xfail_strict = true
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "inmemory: storage-backend parametrization — in-memory tkv",
    "rocksdb: storage-backend parametrization — rocksdb tkv",
    "lmdb: storage-backend parametrization — lmdb tkv",
    "text: storage-backend parametrization — text/debug tkv",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = [
    "src/nu",
]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "reports/coverage"

# =============================================================================
# Ruff
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "src",
]
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "YTT",    # flake8-2020
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "TC",     # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-pathlib
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__ (covered by class docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",   # assert allowed in tests
    "S108",   # /tmp usage allowed in tests
    "T20",    # print allowed in tests
    "D",      # docstrings not required in tests
    "E711",
    "E712",
    "ANN",    # type annotations not required in tests
    "N806",   # disable variable name checks
]
"**/testing/**/*.py" = [
    "S101",
    "T20",
    "D",
    "E711",
    "E712",
    "ANN",
    "N806",
    "B017",
]
"examples/**/*.py" = [
    "S101",
    "T20",
    "D",
    "ANN",
]
"benchmarks/**/*.py" = [
    "S101",
    "T20",
    "D",
    "ANN",
    "B007",
]
"**/ops/control/**/*.py" = [
    "ANN401",  # Any type needed for polymorphic control op parameters
]
"**/refs/std.py" = [
    "N811",   # std Forms (UUID) aliased as *Form to not shadow the stdlib type
    "N812",   # std Forms (date, complex, ...) aliased as *Form for the same reason
]
"src/nu/ui/py/refs/**/*.py" = [
    "D102",     # widget setters are intentionally one-liners; docstring per method is ceremony
    "ANN401",   # _acompile athunks legitimately return Any (host-lifted primitive)
]
"src/nu/ui/nudle/py/**/*.py" = [
    "D102",     # tolerated pre-existing on the host code before the reorg move
    "D103",
    "D205",
    "ANN401",
    "S110",
]

[tool.ruff.lint.isort]
known-first-party = [
    "nu",
    "virtuals", "invisibles",
    ]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# Mypy
# =============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
]

# ============================================================================
# Security
# ============================================================================
[tool.bandit]
exclude_dirs = ["examples/", "docs/"]
