# Workspace root. Not a distribution itself -- it exists to hold the three
# packages, the dev toolchain, and the shared lint / test config.
#
#   packages/nucore -> nucore      (the kernel; owns `nu/__init__.py`)
#   packages/nustd  -> nustd       (the fabrics; no `nu/__init__.py`)
#   packages/nucli  -> nucli       (the `nu` command; no `nu/__init__.py`)
#
# All three install as `nu.*`; nothing about the import surface changed.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nucore = { workspace = true }
nustd = { workspace = true }
nucli = { workspace = true }

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    # All three workspace members, editable, with every fabric backend -- so a
    # bare `uv sync` gives you the full dev environment and the whole suite.
    "nucore",
    "nustd[all]",
    "nucli",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
    "pytest-asyncio>=1.3.0",
]

# Tests stay at the repo root: one suite over both packages.
[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# Underscore prefix on `_support` keeps pytest from auto-collecting it as tests.
pythonpath = [
    "tests/nu",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
xfail_strict = true
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "inmemory: storage-backend parametrization — in-memory tkv",
    "rocksdb: storage-backend parametrization — rocksdb tkv",
    "lmdb: storage-backend parametrization — lmdb tkv",
    "text: storage-backend parametrization — text/debug tkv",
]

[tool.coverage.run]
source = [
    "packages/nucore/src",
    "packages/nustd/src",
    "packages/nucli/src",
]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "reports/coverage"

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "packages/nucore/src",
    "packages/nustd/src",
    "packages/nucli/src",
]
extend-exclude = [".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "YTT",    # flake8-2020
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "TC",     # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-pathlib
]
ignore = [
    "E501",   # handled by formatter
    "D105",   # docstring in magic method
    "D107",   # docstring in __init__ (covered by class docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101", "S108", "T20", "D", "E711", "E712", "ANN", "N806",
]
"**/testing/**/*.py" = [
    "S101", "T20", "D", "E711", "E712", "ANN", "N806", "B017",
]
"examples/**/*.py" = [
    "S101", "T20", "D", "ANN",
]
"benchmarks/**/*.py" = [
    "S101", "T20", "D", "ANN", "B007",
]
"**/ops/control/**/*.py" = [
    "ANN401",  # Any needed for polymorphic control op parameters
]
"**/refs/std.py" = [
    "N811", "N812",  # std Forms (UUID, date, ...) aliased as *Form to not shadow stdlib types
]
"**/src/nu/ui/core/**/*.py" = [
    "D102", "D103",
    "ANN401",  # _acompile athunks legitimately return Any (host-lifted primitive)
]
"**/src/nu/ui/refs/**/*.py" = [
    "D102",    # widget setters are one-liners; docstring per method is ceremony
    "ANN401",
]
"**/src/nu/ui/nudle/**/*.py" = [
    "D102", "D103", "D205", "ANN401", "S110",
]
"**/src/nu/http/methods.py" = [
    "N802",  # GET/POST/PUT/PATCH/DELETE mirror HTTP verbs
]

[tool.ruff.lint.isort]
known-first-party = [
    "nu",
    "virtuals", "invisibles",
    ]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
]

[tool.bandit]
exclude_dirs = ["examples/"]
