# ============================================================================
# Build System
# ============================================================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ============================================================================
# Project Metadata (PEP 621)
# ============================================================================
[project]
name = "everybase"
version = "2.0.0"
description = "Term Programming platform - protocols and implementations for topology-based software"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Gor Arakelyan", email = "gorarkln@gmail.com"}
]
maintainers = [
    {name = "Gor Arakelyan", email = "gorarkln@gmail.com"}
]
keywords = [
    "term-programming",
    "topology",
    "declarative",
    "protocols",
    "flows",
    "orchestration",
    "ai-native",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "attrs",
]

[project.urls]
Homepage = "https://github.com/everyabc/everybase"
Documentation = "https://github.com/everyabc/everybase#readme"
Repository = "https://github.com/everyabc/everybase"
Issues = "https://github.com/everyabc/everybase/issues"
Changelog = "https://github.com/everyabc/everybase/releases"

[project.optional-dependencies]

# Development tools
dev = [
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

# Testing
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.0.0",
]

# All development dependencies
all = [
    "everybase[dev,test]",
]

# ============================================================================
# Package Discovery - Multiple source roots
# ============================================================================
[tool.setuptools.packages.find]
where = ["src", "protocols/everyterm/src", "protocols/everyflow/src", "protocols/everylink/src", "pkgs"]
include = ["everybase*", "everyterm*", "everyflow*", "everylink*"]
namespaces = false

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src/everybase/tests",
    "protocols/everyterm/tests",
    "protocols/everyflow/tests",
    "protocols/everylink/tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
source = ["src", "protocols"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "tests/reports/coverage"

# ============================================================================
# Linting & Formatting - Ruff
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "protocols", "pkgs", "tests"]
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "YTT",    # flake8-2020
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
    "D",      # pydocstyle
    "ANN",    # flake8-annotations
    "TC",     # flake8-type-checking
    "RUF",    # ruff-specific rules
    "PTH",    # flake8-pathlib
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "D105",   # Missing docstring in magic method
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",   # assert allowed in tests
    "T20",    # print allowed in tests
    "D",      # docstrings not required in tests
    "E711",
    "E712",
    "ANN",    # type annotations not required in tests
    "N806",   # disable variable name checks
]
"**/testing/**/*.py" = [
    "S101",
    "T20",
    "D",
    "E711",
    "E712",
    "ANN",
    "N806",
    "B017",
]
"examples/**/*.py" = [
    "S101",
    "T20",
    "D",
    "ANN",
]

[tool.ruff.lint.isort]
known-first-party = ["everybase", "everyterm", "everyflow", "everylink"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80

# ============================================================================
# Type Checking - mypy
# ============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
]

# ============================================================================
# Security
# ============================================================================
[tool.bandit]
exclude_dirs = ["tests/", "examples/", "docs/"]
